<div class="flex flex-col gap-6 md:flex-row">
  <div class="h-[70vh] w-full rounded-lg border border-border md:w-2/3">
    <app-map [markers]="markers()" (markerClick)="onMarkerClick($event)" />
  </div>

  <div class="w-full md:w-1/3">
    <h2 class="mb-3 text-base font-semibold">Climbing areas</h2>
    <ul class="flex flex-col gap-2">
      @for (area of areas.value(); track area.id) {
        <li>
          <a routerLink="/areas/{{ area.id }}" hlmCard class="block p-3 hover:border-primary/50">
            <div class="font-medium">{{ area.name }}</div>
            @if (area.description) {
              <p class="text-sm text-muted-foreground">{{ area.description }}</p>
            }
          </a>
        </li>
      } @empty {
        <li class="text-sm text-muted-foreground">No areas yet.</li>
      }
    </ul>
  </div>
</div>
