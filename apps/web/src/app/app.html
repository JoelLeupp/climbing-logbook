<div class="min-h-screen bg-background text-foreground">
  <header class="flex items-center justify-between border-b border-border px-6 py-3">
    <a routerLink="/" class="text-lg font-semibold">🧗 Climbing Logbook</a>
    <nav class="flex items-center gap-4 text-sm">
      @if (auth.user(); as user) {
        <span class="text-muted-foreground">{{ user.name }}</span>
        <button hlmBtn variant="ghost" size="sm" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/login" class="text-muted-foreground hover:text-foreground">Log in</a>
        <a routerLink="/register" class="text-muted-foreground hover:text-foreground">Register</a>
      }
    </nav>
  </header>

  <main class="p-6">
    <router-outlet />
  </main>
</div>
