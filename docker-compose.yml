# Note: postgis/postgis and minio/minio are blocked by SIX's Docker Hub org-wide
# image access policy (sixgroupag). No code currently uses PostGIS geometry types
# (schema uses plain lat/lng double precision columns) or MinIO (media storage
# defaults to local disk, see apps/api/src/lib/storage.ts), so plain postgres and
# an unblocked MinIO-compatible image (cleanstart/minio) are used instead.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-climbing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climbing}
      POSTGRES_DB: ${POSTGRES_DB:-climbing_logbook}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-climbing} -d ${POSTGRES_DB:-climbing_logbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cleanstart/minio:latest
    # cleanstart/minio (Chainguard-based) runs as non-root uid 65532 by default;
    # the named docker volume is created root-owned, so it can't write to /data
    # unless we run as root here.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-climbing}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-climbing-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
